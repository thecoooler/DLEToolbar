slug: DLEToolbar
name: DLEToolbar
description: 'Панель администратора на сайте: метрики страницы, SQL-запросы, сброс кэша, смена шаблона'
mount: engine/iCooLER/DLEToolbar
build:
  split: false
extras:
  admin_section: false
  autoloader: true
  routes: []
  configs: []
di:
  bindings: {}
alias:
    admin.php: engine/inc/dletoolbar.php
    notes.php: engine/ajax/dletoolbar_notes.php
files:
  engine/init.php:
    - after:
        search: |
          dle_session();
        replace: |
          $DLEToolbar = null;
          try {
            $DLEToolbar = new \iCooLER\DLEToolbar\Toolbar\DLEToolbar();
          } catch (\Throwable $error) {
            error_log('[DLEToolbar] bootstrap: ' . $error);
          }

    - before:
        search: |
          if ( isset( $banned_info['ip'] ) ) $blockip = check_ip ( $banned_info['ip'] );  else $blockip = false;
        replace: |
          try {
            if ($DLEToolbar !== null) $DLEToolbar->init();
          } catch (\Throwable $error) {
            $DLEToolbar = null;
            error_log('[DLEToolbar] initialization: ' . $error);
          }

  engine/modules/show.full.php:
    - before:
        search: |
          $news_id = $row['id'];
        replace: |
          try {
            if ($DLEToolbar !== null && $DLEToolbar->isHasAccess()) {
              \iCooLER\DLEToolbar\Components\Entry\PageEntry::captureNews($row);
              \iCooLER\DLEToolbar\Components\Link\NewsFields::capture($row['xfields']);
            }
          } catch (\Throwable $error) {
            error_log('[DLEToolbar] news fields: ' . $error);
          }

  engine/modules/profile.php:
    - before:
        search: |
          if( $row['banned'] == 'yes' )
        replace: |
          try {
            if ($DLEToolbar !== null && $DLEToolbar->isHasAccess()) {
              \iCooLER\DLEToolbar\Components\Entry\PageEntry::captureUser($row);
            }
          } catch (\Throwable $error) {
            error_log('[DLEToolbar] user profile: ' . $error);
          }

  engine/modules/main.php:
    - before:
        search: |
          $tpl->set ( '{AJAX}', $ajax );
        replace: |
          if ($DLEToolbar !== null && $DLEToolbar->isHasAccess()) {
            $ajax .= $DLEToolbar->marker();
          }
    - before:
        search: |
          echo $tpl->result['main'];
        replace: |
          try {
            if ($DLEToolbar !== null && $DLEToolbar->isHasAccess()) {
              require_once \DLEPlugins::Check(ENGINE_DIR . "/iCooLER/DLEToolbar/main.php");
            }
          } catch (\Throwable $error) {
            $tpl->result['main'] = str_replace($DLEToolbar->marker(), '', $tpl->result['main']);
            error_log('[DLEToolbar] output: ' . $error);
          }
mysql:
  install: |
    CREATE TABLE IF NOT EXISTS `{prefix}_dletoolbar_settings` (
      `id` INT UNSIGNED NOT NULL AUTO_INCREMENT,
      `setting_key` VARCHAR(191) COLLATE utf8mb4_bin NOT NULL,
      `setting_value` MEDIUMTEXT NOT NULL,
      `updated_at` DATETIME NOT NULL,
      PRIMARY KEY (`id`),
      UNIQUE KEY `setting_key` (`setting_key`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
    CREATE TABLE IF NOT EXISTS `{prefix}_dletoolbar_notes` (
      `id` INT UNSIGNED NOT NULL AUTO_INCREMENT,
      `title` VARCHAR(200) NOT NULL,
      `created_at` DATETIME DEFAULT NULL,
      `request_key` CHAR(32) CHARACTER SET ascii COLLATE ascii_bin DEFAULT NULL,
      `body` MEDIUMTEXT NOT NULL,
      `page_url` VARCHAR(2048) NOT NULL DEFAULT '',
      `pinned` TINYINT UNSIGNED NOT NULL DEFAULT 0,
      `updated_at` DATETIME NOT NULL,
      PRIMARY KEY (`id`),
      UNIQUE KEY `request_key` (`request_key`),
      KEY `notes_updated_at` (`updated_at`, `id`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
  upgrade: |
    CREATE TABLE IF NOT EXISTS `{prefix}_dletoolbar_notes` (
      `id` INT UNSIGNED NOT NULL AUTO_INCREMENT,
      `title` VARCHAR(200) NOT NULL,
      `created_at` DATETIME DEFAULT NULL,
      `request_key` CHAR(32) CHARACTER SET ascii COLLATE ascii_bin DEFAULT NULL,
      `body` MEDIUMTEXT NOT NULL,
      `page_url` VARCHAR(2048) NOT NULL DEFAULT '',
      `pinned` TINYINT UNSIGNED NOT NULL DEFAULT 0,
      `updated_at` DATETIME NOT NULL,
      PRIMARY KEY (`id`),
      UNIQUE KEY `request_key` (`request_key`),
      KEY `notes_updated_at` (`updated_at`, `id`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
    SET @dletoolbar_sql = IF(
      EXISTS(SELECT 1 FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = '{prefix}_dletoolbar_notes' AND COLUMN_NAME = 'created_at'),
      'SET @dletoolbar_noop = 1',
      'ALTER TABLE `{prefix}_dletoolbar_notes` ADD COLUMN `created_at` DATETIME DEFAULT NULL AFTER `title`'
    );
    PREPARE dletoolbar_migration FROM @dletoolbar_sql;
    EXECUTE dletoolbar_migration;
    DEALLOCATE PREPARE dletoolbar_migration;
    SET @dletoolbar_sql = IF(
      EXISTS(SELECT 1 FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = '{prefix}_dletoolbar_notes' AND COLUMN_NAME = 'request_key'),
      'SET @dletoolbar_noop = 1',
      'ALTER TABLE `{prefix}_dletoolbar_notes` ADD COLUMN `request_key` CHAR(32) CHARACTER SET ascii COLLATE ascii_bin DEFAULT NULL AFTER `created_at`'
    );
    PREPARE dletoolbar_migration FROM @dletoolbar_sql;
    EXECUTE dletoolbar_migration;
    DEALLOCATE PREPARE dletoolbar_migration;
    SET @dletoolbar_sql = IF(
      EXISTS(SELECT 1 FROM information_schema.STATISTICS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = '{prefix}_dletoolbar_notes' AND INDEX_NAME = 'request_key'),
      'SET @dletoolbar_noop = 1',
      'ALTER TABLE `{prefix}_dletoolbar_notes` ADD UNIQUE KEY `request_key` (`request_key`)'
    );
    PREPARE dletoolbar_migration FROM @dletoolbar_sql;
    EXECUTE dletoolbar_migration;
    DEALLOCATE PREPARE dletoolbar_migration;
    SET @dletoolbar_sql = IF(
      EXISTS(SELECT 1 FROM information_schema.STATISTICS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = '{prefix}_dletoolbar_notes' AND INDEX_NAME = 'notes_updated_at'),
      'SET @dletoolbar_noop = 1',
      'ALTER TABLE `{prefix}_dletoolbar_notes` ADD KEY `notes_updated_at` (`updated_at`, `id`)'
    );
    PREPARE dletoolbar_migration FROM @dletoolbar_sql;
    EXECUTE dletoolbar_migration;
    DEALLOCATE PREPARE dletoolbar_migration;
    UPDATE `{prefix}_admin_sections` SET `descr` = 'Панель администратора на сайте: метрики страницы, SQL-запросы, сброс кэша, смена шаблона', `allow_groups` = '1' WHERE `name` = 'dletoolbar';
  enable: |
    INSERT IGNORE INTO `{prefix}_admin_sections` (`name`, `title`, `descr`, `icon`, `allow_groups`) VALUES ('dletoolbar', 'DLEToolbar', 'Панель администратора на сайте: метрики страницы, SQL-запросы, сброс кэша, смена шаблона', '', '1');
  disable: |
    DELETE FROM `{prefix}_admin_sections` WHERE `name` = 'dletoolbar';
  delete: |
    DELETE FROM `{prefix}_admin_sections` WHERE `name` = 'dletoolbar';
php:
  install: ''
  upgrade: ''
  enable: ''
  disable: ''
  delete: ''
